# Experimental dual-USB CYD 2.8" with ILI9342 display + XPT2046.
# Uses ESPHome's board-specific initialization (RGB order).
# This profile does not support capacitive touch variants.
substitutions:
  display_driver: mipi_spi
  display_model: ESP32-2432S028-9342
  display_spi_mode: MODE0
  display_data_rate: 20MHz
  display_color_order: rgb
  display_invert_colors: "false"
  display_swap_xy: "false"
  display_mirror_x: "false"
  display_mirror_y: "false"
  display_dimensions:
    width: 320
    height: 240
    offset_width: 0
    offset_height: 0
    pad_width: 0
    pad_height: 0
