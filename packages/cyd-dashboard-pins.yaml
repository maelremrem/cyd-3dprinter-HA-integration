substitutions:
  # ── CYD hardware pins ─────────────────────────────────────────────────────
  # Default values match the standard CYD (Cheap Yellow Display) board.
  # Only change these if your board uses different GPIO assignments.
  pin_spi_clk: GPIO14
  pin_spi_mosi: GPIO13
  pin_spi_miso: GPIO12
  pin_tft_cs: GPIO15
  pin_tft_dc: GPIO2
  pin_tft_bl: GPIO21
  pin_touch_cs: GPIO33
  pin_touch_irq: GPIO36
  pin_touch_clk: GPIO25
  pin_touch_mosi: GPIO32
  pin_touch_miso: GPIO39
  # Match the GPIOs used by the dashboard before profile support.
  pin_rgb_r: GPIO4
  pin_rgb_g: GPIO16
  pin_rgb_b: GPIO17
  
  # ── Display config ─────────────────────────────────────────────────────────
  # Stable default for genuine 2.8" ILI9341 + XPT2046 CYD boards.
  # Both ili9xxx and mipi_spi accept the shared fields below.
  display_driver: ili9xxx
  display_model: ILI9341
  display_spi_mode: MODE0
  display_data_rate: 20MHz
  display_color_order: bgr
  display_invert_colors: "false"

  # Logical LVGL/touch area: the dashboard UI is designed for 320x240.
  display_w: "320"
  display_h: "240"
  display_swap_xy: "true"
  display_mirror_x: "false"
  display_mirror_y: "false"

  # Driver framebuffer dimensions; mipi_spi profiles include pad_width/
  # pad_height=0 to avoid its "Invalid offsets" error with swapped axes.
  display_dimensions:
    width: 320
    height: 240
    offset_width: 0
    offset_height: 0

  # The previous hard-coded minimum revision (3.1) prevented older CYDs
  # from booting (issue #7). Do not force SRAM1-as-IRAM on old bootloaders.
  minimum_chip_revision: "0.0"
  
  # ── Touch calibration ──────────────────────────────────────────────────────
  touch_swap_xy: "true"
  touch_mirror_x: "false"
  touch_mirror_y: "false"
  touch_cal_x_min: "280"
  touch_cal_x_max: "3860"
  touch_cal_y_min: "340"
  touch_cal_y_max: "3860"
